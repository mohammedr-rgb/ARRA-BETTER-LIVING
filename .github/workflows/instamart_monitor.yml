name: Instamart Price & Stock Monitor Agent

on:
  schedule:
    # Runs twice daily at 8:00 AM IST (02:30 UTC) and 6:00 PM IST (12:30 UTC)
    - cron: '30 2 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Explicit permissions required to push commits back to the repo
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Instamart Monitor Agent
        run: npm run monitor:instamart
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: Commit and Push Updated Snapshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(data): auto-update Instamart live price snapshot [skip ci]"
            git push origin master
          else
            echo "No data changes to commit."
          fi

      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
