name: Instamart Price & Stock Monitor Agent

on:
  schedule:
    # Runs twice daily at 8:00 AM IST (02:30 UTC) and 6:00 PM IST (12:30 UTC)
    - cron: '30 2 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Instamart Monitor Agent
        run: npm run monitor:instamart
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: Commit and Push Updated Snapshots
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Instamart Monitor Agent"
          git add public/data/instamart_gems_gold_live.json public/data/instamart_daily_history.json public/data/instamart_gems_gold_25cities.csv public/data/instamart_live_snapshot.json public/data/instamart_parity_export.csv
          git diff-index --quiet HEAD || git commit -m "chore(data): auto-update Instamart live price snapshot [skip ci]"
          git push
