name: Instamart Live Monitor

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instamart-live-monitor
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run monitoring regression tests
        run: npm test

      - name: Check authorized feed configuration
        id: feed
        shell: bash
        env:
          INSTAMART_FEED_URL: ${{ secrets.INSTAMART_FEED_URL }}
          INSTAMART_FEED_TOKEN: ${{ secrets.INSTAMART_FEED_TOKEN }}
        run: |
          if [[ -n "$INSTAMART_FEED_URL" && -n "$INSTAMART_FEED_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Authorized feed credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live monitoring is not active: add INSTAMART_FEED_URL and INSTAMART_FEED_TOKEN from an authorized provider."
          fi

      - name: Fetch and validate live observations
        if: steps.feed.outputs.configured == 'true'
        env:
          INSTAMART_FEED_URL: ${{ secrets.INSTAMART_FEED_URL }}
          INSTAMART_FEED_TOKEN: ${{ secrets.INSTAMART_FEED_TOKEN }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: npm run monitor:instamart

      - name: Commit updated observations
        if: steps.feed.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/instamart_gems_gold_live.json public/data/instamart_gems_gold_25cities.csv public/data/instamart_daily_history.json public/data/instamart_live_snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(instamart): refresh authorized live observations"
            git push origin HEAD:master
          fi

      - name: Build dashboard
        if: github.event_name == 'push' || steps.feed.outputs.configured == 'true'
        run: npm run build

      - name: Deploy GitHub Pages
        if: github.event_name == 'push' || steps.feed.outputs.configured == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
